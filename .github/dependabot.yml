version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Expo pins native modules to the SDK; majors move with `npx expo install --fix`.
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    groups:
      mobile:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /supabase
    schedule:
      interval: weekly
    groups:
      supabase:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
